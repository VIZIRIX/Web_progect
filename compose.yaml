services:
  postgres-db:
    image: postgres:16-alpine
    container_name: web_project_db
    environment:
      POSTGRES_USER: vizirix
      POSTGRES_PASSWORD: my_secure_password
      POSTGRES_DB: web_project_database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizirix -d web_project_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: web_project_backend
    command: pnpm run dev:server
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://vizirix:my_secure_password@postgres-db:5432/web_project_database?schema=public
      - PORT=5000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build: .
    container_name: web_project_frontend
    command: pnpm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
