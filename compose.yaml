services:
  postgres-db:
    image: postgres:16-alpine
    container_name: web_project_db
    environment:
      POSTGRES_USER: ${DB_USER:-vizirix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_secure_password}
      POSTGRES_DB: ${DB_NAME:-web_project_database}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vizirix} -d ${DB_NAME:-web_project_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: web_project_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://vizirix:my_secure_password@postgres-db:5432/web_project_database?schema=public
      CLIENT_ORIGIN: http://web_project_frontend:5173
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_here}
      PORT: 5000
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: web_project_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: