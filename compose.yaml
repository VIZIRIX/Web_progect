services:
  postgres-db:
    image: postgres:16-alpine
    container_name: web_project_db
    environment:
      POSTGRES_USER: ${DB_USER:-vizirix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_secure_password}
      POSTGRES_DB: ${DB_NAME:-web_project_database}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vizirix} -d ${DB_NAME:-web_project_database}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: web_project_backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://vizirix:my_secure_password@postgres-db:5432/web_project_database?schema=public
      PORT: 5000
      JWT_SECRET: your_super_secret_key_here
    volumes:
      - ./server:/app/server
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: web_project_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
    depends_on:
      - backend

volumes:
  pgdata: