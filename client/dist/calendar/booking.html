<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь Бронирования</title>
  <script type="module" crossorigin src="/assets/calendar-Bg89tUJu.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-CehvFGBj.js">
  <link rel="stylesheet" crossorigin href="/assets/calendar-Db83BDpV.css">
</head>

<body>
    <main class="calendar">
        <header class="calendar-header">
            <a href="/booking/booking.html" class="booking-page-button">
                + Забронировать комнату
            </a>
            <h1>Календарь Бронирования</h1>
            <nav class="calendar-nav">
                <button id="prev-btn" type="button" aria-label="Предыдущий месяц">&lt;</button>
                <div class="month-year" id="month-year"></div>
                <button id="next-btn" type="button" aria-label="Следующий месяц">&gt;</button>
            </nav>
        </header>

        <section class="weekdays" aria-hidden="true">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div>Сб</div>
            <div>Вс</div>
        </section>

        <div class="days" id="days-container" role="grid"></div>
    </main>


</body>

</html>
