<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь Бронирования</title>
  <link rel="stylesheet" crossorigin href="/assets/index-DXIM3Apq.css">
</head>

<body>
    <div class="calendar">
        <h1 style="text-align: center;">Календарь Бронирования</h1>
        <div class="calendar-header">
            <button id="prev-btn">&lt;</button>
            <div class="month-year" id="month-year"></div>
            <button id="next-btn">&gt;</button>
        </div>

        <div class="weekdays">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div>Сб</div>
            <div>Вс</div>
        </div>

        <div class="days" id="days-container"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
